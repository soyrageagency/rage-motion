<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rage-motion">
  <title>rage-motion</title>
  <!--
    The mark is the library's own easing curve, and it happens to be the letter.

    cubic-bezier(0.22, 1, 0.36, 1) is the ease every entrance in the kit is built
    on. Drawn literally — the unit square of an easing editor, the curve across
    it, the control point that gives it its shape — it comes out as a lowercase
    r. Nothing here is decoration: move the control point and the mark stops
    being true, and stops being a letter.

    Four shapes, so it survives being sixteen pixels wide in a browser tab.
  -->
  <defs>
    <clipPath id="rmFrame">
      <rect x="7" y="7" width="50" height="50" rx="14"/>
    </clipPath>
  </defs>

  <rect x="7" y="7" width="50" height="50" rx="14"
        fill="none" stroke="currentColor" stroke-opacity="0.24" stroke-width="2.5"/>

  <g clip-path="url(#rmFrame)">
    <!-- The handle from the start of the curve to its first control point. -->
    <line x1="11" y1="55" x2="22" y2="12"
          stroke="currentColor" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <!-- The curve itself, at the frame's scale. -->
    <path d="M11 55 C 22 12, 29 12, 53 12"
          fill="none" stroke="#2aa7e4" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- One control point. Two of them merge into a smudge at tab size. -->
  <circle cx="22" cy="12" r="4" fill="currentColor"/>
</svg>
